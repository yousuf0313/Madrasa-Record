name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # The project travels as one zip (browser upload route); extract it here.
      - name: Extract Project
        run: |
          unzip -o madrasa-project.zip -d .
          test -f gradle/wrapper/gradle-wrapper.jar
          test -f app/src/main/assets/fonts/NotoNastaliqUrdu.ttf
          ls app/src/main/assets/fonts | wc -l

      - name: Build Release APK (unsigned)
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          ls -la app/build/outputs/apk/release/

      - name: Upload Unsigned APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: digital-asan-hazri-unsigned-apk
          path: app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Upload R8 Outputs
        uses: actions/upload-artifact@v4
        with:
          name: r8-outputs
          path: |
            app/build/outputs/mapping/release/mapping.txt
            app/build/outputs/mapping/release/usage.txt
            app/build/outputs/mapping/release/seeds.txt
            app/build/outputs/mapping/release/configuration.txt
          if-no-files-found: ignore

      # Retrieval route (same as Easy Chat): the unsigned APK is attached to a
      # clearly-marked CI prerelease so it can be downloaded and signed locally
      # with the project keystore. Official releases are published separately.
      - name: Publish CI Prerelease (unsigned, for local signing)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp app/build/outputs/apk/release/app-release-unsigned.apk Digital-Asan-Hazri-Register-v1.0.7-unsigned.apk
          gh release create "v1.0.7-ci" --prerelease \
            --title "CI build v1.0.7 (unsigned — do not install)" \
            --notes "Unsigned CI build of the Gradle migration. This APK is signed locally with the project keystore before delivery; do not install this file." \
            Digital-Asan-Hazri-Register-v1.0.7-unsigned.apk \
          || gh release upload "v1.0.7-ci" Digital-Asan-Hazri-Register-v1.0.7-unsigned.apk --clobber
